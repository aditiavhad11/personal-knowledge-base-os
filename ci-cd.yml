name: Personal Knowledge Base - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkb-production
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Check tool versions
        run: |
          python --version
          node --version
          npm --version
          git --version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Backend code quality - Ruff
        run: ruff check apps/api/src tests

      - name: Python subprocess diagnostic
        run: |
          python -c "import subprocess,sys; p=subprocess.run([sys.executable,'-c','print(12345)'],capture_output=True,text=True); print('RETURN CODE:',p.returncode); print('OUTPUT:',p.stdout.strip()); print('ERROR:',p.stderr.strip()); sys.exit(p.returncode)"

      - name: Backend tests - Pytest
        run: python -m pytest -q

      - name: Backend type checking - Pyright
        run: pyright apps/api/src

      - name: Build Python package
        run: python -m build

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        working-directory: apps/web
        run: npm test

      - name: Frontend type checking
        working-directory: apps/web
        run: npm exec tsc -- --noEmit

      - name: Frontend lint
        working-directory: apps/web
        run: npm run lint

      - name: Frontend production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkb-build-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.whl
            apps/web/.next/**

  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing EC2_SSH_KEY secret" && exit 1)

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/pkb_ec2
          chmod 600 ~/.ssh/pkb_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment script to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/pkb_ec2 deploy/deploy-ec2.sh \
            "$EC2_USER@$EC2_HOST:/tmp/pkb-deploy.sh"

      - name: Run deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/pkb_ec2 "$EC2_USER@$EC2_HOST" \
            "chmod +x /tmp/pkb-deploy.sh && /tmp/pkb-deploy.sh"

      - name: Verify deployed application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/pkb_ec2 "$EC2_USER@$EC2_HOST" 'set -e
            sudo systemctl is-active --quiet pkb-backend
            sudo systemctl is-active --quiet pkb-frontend
            sudo systemctl is-active --quiet nginx
            curl -fsS http://127.0.0.1:8000/health
            curl -fsS http://127.0.0.1/api/health
            curl -fsS http://127.0.0.1:3000/ >/dev/null
            curl -fsS http://127.0.0.1/ >/dev/null
            df -h /
            echo "CI/CD DEPLOYMENT HEALTH CHECK PASSED"
          '
